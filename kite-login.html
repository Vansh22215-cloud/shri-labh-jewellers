<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kite login</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#f6f7f9; --fg:#14171f; --muted:#5b6270; --btn:#2a7de1; --btnfg:#fff; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --fg:#e8eaee; --muted:#a3a9b6; --btn:#4b95ef; --card:#1b1f27; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width:420px; margin:12vh auto; padding:24px 16px; }
  .card { background:var(--card); border-radius:14px; padding:24px; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--muted); margin:8px 0 18px; }
  a.btn { display:block; text-align:center; background:var(--btn); color:var(--btnfg); text-decoration:none;
          padding:14px; border-radius:10px; font-weight:600; }
</style>
</head>
<body>
<main><div class="card">
  <h1 id="t">Connecting…</h1>
  <p id="m">One moment.</p>
  <div id="ok" style="display:none">
    <p style="margin:0 0 8px"><b>1.</b> Copy this code:</p>
    <code id="c" style="display:block; padding:12px; border-radius:8px; background:rgba(127,127,127,.15); word-break:break-all; color:var(--fg)"></code>
    <a class="btn" id="cp" href="#" style="margin-top:10px">Copy code</a>
    <p style="margin:18px 0 8px"><b>2.</b> Open your bot and paste it as a message (within 5 minutes):</p>
    <a class="btn" id="tg" href="#">Open Telegram</a>
  </div>
</div></main>
<script>
  // Zerodha sends you here after login with a one-time request token (useless without the secret,
  // which only the GitHub run has). This page only helps you hand it to your own bot; it stores nothing.
  // No automatic jump: some Indian networks block the t.me website, so the Telegram app is opened directly.
  var BOT = "Vsjshsjsbaksnsjsh_bot";
  var q = new URLSearchParams(location.search);
  var tok = q.get("request_token") || "";
  var good = q.get("status") === "success" && /^[A-Za-z0-9]{8,64}$/.test(tok);
  var t = document.getElementById("t"), m = document.getElementById("m");
  if (good) {
    var msg = "kite_" + tok;
    t.textContent = "Logged in to Zerodha ✓";
    m.textContent = "Last step - give the code to your bot:";
    document.getElementById("ok").style.display = "block";
    document.getElementById("c").textContent = msg;
    document.getElementById("tg").href = "tg://resolve?domain=" + BOT + "&start=" + msg;
    var cp = document.getElementById("cp");
    cp.onclick = function (e) {
      e.preventDefault();
      var done = function () { cp.textContent = "Copied ✓ - now tap Open Telegram and paste"; };
      if (navigator.clipboard) { navigator.clipboard.writeText(msg).then(done, function () {
        cp.textContent = "Press and hold the code above to copy it"; }); } else { done(); }
    };
  } else {
    t.textContent = "Login not completed";
    m.textContent = "Zerodha did not confirm the login. Go back to Telegram and send /kite for a new link.";
  }
</script>
</body>
</html>
