# ATLAS (rebuilt 20 Nov 2026) - runs on GitHub's free computers (no laptop, no Claude needed).
# Times are UTC (IST = UTC + 5:30). GitHub may start scheduled jobs a few minutes late.
name: swing-system

on:
  schedule:
    # Safety net only: the always-on run does every job on time and starts the next run itself (keep_alive.py).
    # If that chain ever breaks, this hourly start brings it back.
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "bot (the always-on run)"
        required: true
        default: bot

permissions:
  contents: write
  actions: write     # only so a run can start the next one (keeps the system running all day, see keep_alive.py)

concurrency:
  group: swing-system
  cancel-in-progress: false

env:
  SWING_BRANCH: claude/nse-swing-trading-system-sqncpt

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: swing-system
    steps:
      - name: Pick the task
        id: task
        working-directory: .
        run: |
          S="${{ github.event.schedule }}"
          T="${{ github.event.inputs.task }}"
          case "$S" in
            "25 * * * *") T=bot ;;
          esac
          echo "task=${T:-bot}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SWING_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: swing-system/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Free disk space (GitHub's computer comes with ~25 GB of tools we never use)
        working-directory: .
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true

      - name: Restore saved data
        uses: actions/cache/restore@v4
        with:
          path: swing-system/data
          key: swing-data-${{ github.run_id }}
          restore-keys: swing-data-

      - name: Run ${{ steps.task.outputs.task }}
        env:   # private values are passed in memory only, never written to a file
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}         # Zerodha market data only (no order placing)
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
        run: |
          python scripts/bot_poll.py      # the always-on run: bot, live feed, downloads, tests, Learner

      - name: Start the next run (keeps the system running all day, no outside timer needed)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/keep_alive.py || true

      - name: Save data for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: swing-system/data
          key: swing-data-${{ github.run_id }}

      - name: Delete older saved copies (one copy of the data uses GitHub's 10 GB, not several)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/clean_caches.py || true

      # (no file uploads here: this repository is public, so personal files are backed up to your Telegram instead)

      - name: Save results to GitHub
        if: always()
        run: python -c "from swing.ci_save import save; print('save:', save('end of run'))" || true
