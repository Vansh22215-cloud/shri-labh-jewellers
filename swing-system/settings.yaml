# ============================================================
#  ATLAS SETTINGS (rebuilt 20 Nov 2026 - owner: start again, Kite data only)
# ============================================================

# Your trading money in rupees (change with /capital in Telegram). 0 = no quantities are suggested.
capital: 51000

# KILL SWITCH: true stops ALL tips immediately (also /stop and /resume in Telegram).
kill_switch: false

# Default stop-loss for every strategy: 1% below the entry (owner 20 Nov). A strategy can only change it if
# the owner says so.
stop_loss_pct: 1.0

# Quantity limits (unchanged from before): the loss at the stop is at most risk_per_trade_pct of capital and one
# position at most max_order_pct of capital - whichever gives the smaller quantity.
risk_limits:
  risk_per_trade_pct: 1
  max_order_pct: 25
  daily_loss_pct: 2

# Strategies that may send live tips. A strategy is added here only after its Kite test and the owner's yes.
live_strategies: []

# Keep the GitHub runs going all day (scripts/keep_alive.py).
keep_alive: true

# PRACTICE ACCOUNT (owner 20 Nov): pretend money, real Kite prices, real charges - no real order is ever placed.
# Every entry/exit is sent to Telegram at once; the dashboard comes after the close. Rules: swing/autotrader.py.
paper_trading: true
paper_capital: 50800
