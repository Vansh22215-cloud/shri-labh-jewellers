# ============================================================
#  YOUR SETTINGS  (safe to edit in Notepad; keep the spacing)
# ============================================================

# Your trading capital in rupees.
capital: 45000

# KILL SWITCH: change "false" to "true" to stop ALL tips immediately.
kill_switch: false

# TIPS MODE
#   validated  = tips only when a strategy passes the strict validation gate (safest; currently none passes)
#   aggressive = you asked for daily ideas anyway: uses the best strategy the system can find today,
#                clearly labelled NOT validated, with hard safety brakes (see DECISIONS.md D52-D55)
# Owner's reset on 2026-11-11: system tips before this day are retired (archived in journal/tips_retired.csv).
tips_start_date: "2026-11-11"
tips_mode: aggressive
# Live engine (D95): only trades ranked at least this (1-10) are sent; no daily cap (owner's choice).
min_rank: 8   # raise to 9 for even fewer, stronger tips
# Owner's choice 2026-11-11: live intraday tips (aggressive). Only setups passing the Kite-history test keep
# sending (DECISIONS D94). Max tips a day, none after 2:30 pm.
intraday_tips: false   # the live engine sends intraday tips now (D95)
intraday_max_tips: 2
aggressive_strategy: a3
# Stop ALL aggressive tips if their total result reaches this loss (% of capital).
aggressive_hard_stop_pct: 20

# "paper" = tips are recorded and tracked but you should NOT trade real money yet.
# The system stays in paper mode for at least paper_weeks after paper_start_date.
mode: live
paper_start_date: 2026-11-02
paper_weeks: 0

# Optional: Telegram alerts. Paste your bot token and chat id between the quotes.
telegram_bot_token: ""
telegram_chat_id: ""

# Which strategy version is live (managed by the weekly improvement job).
live_strategy: v1

# Safety limits for order tickets and recorded trades (owner's choice: standard).
risk_limits:
  risk_per_trade_pct: 1      # max loss at the stop per trade (% of capital)
  daily_loss_pct: 2          # no new trades after losing this much in a day
  max_trades_per_day: 3
  max_order_pct: 25          # no single order above this share of capital
